version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codesphere-postgres
    environment:
      POSTGRES_USER: codesphere
      POSTGRES_PASSWORD: codesphere
      POSTGRES_DB: codesphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codesphere-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: codesphere-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://codesphere:codesphere@postgres:5432/codesphere
      REDIS_URL: redis://redis:6379
      JWT_SECRET: codesphere-super-secret-key-2026
      WARM_POOL_SIZE: 2
      EXEC_TIMEOUT_MS: 30000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: codesphere-worker
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://codesphere:codesphere@postgres:5432/codesphere
      REDIS_URL: redis://redis:6379
      JWT_SECRET: codesphere-super-secret-key-2026
      WORKER_CONCURRENCY: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: codesphere-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
